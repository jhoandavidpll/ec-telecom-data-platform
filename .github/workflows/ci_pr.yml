name: "CI - Pull Request Quality & Safety Gates"

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  branch-naming:
    name: "Validate Branch Name"
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Naming Convention
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Validating branch: $BRANCH_NAME"
          REGEX="^(feat|fix|chore|docs|refactor|test)/[a-z0-9_-]+/(issue-|task-|TASK-)?[0-9]+-[a-z0-9-]+$"
          if [[ ! "$BRANCH_NAME" =~ $REGEX ]]; then
            echo "::error::Branch name '$BRANCH_NAME' does not match convention: type/user/(issue-X|task-X|X)-short-description"
            echo "Allowed types: feat, fix, chore, docs, refactor, test"
            echo "Examples: feat/jhoan/issue-1-ingesta-arcotel, feat/jhoan/1-ingesta-arcotel, feat/jhoan/task-1-ingesta-arcotel"
            exit 1
          fi
          echo "Branch naming validation passed!"

  code-quality:
    name: "Linting & Static Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Python Linting (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__

      - name: Unit Tests (Zero-Cloud Pytest)
        run: |
          pytest tests/

      - name: dbt Project Syntax Parse
        run: |
          dbt deps --profiles-dir docker
          dbt parse --profiles-dir docker

  dbt-qas-validation:
    name: "dbt QAS Validation (Cloud Gate)"
    runs-on: ubuntu-latest
    needs: [branch-naming, code-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Evaluate Databricks Secrets Availability
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DATABRICKS_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "Notice: Running from external fork without secrets. Skipping live Databricks execution."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dbt & packages
        if: steps.check-secrets.outputs.has_token == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dbt in QAS
        if: steps.check-secrets.outputs.has_token == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ENV: qas
        run: |
          echo "Executing dbt build against QAS environment..."
          dbt deps --profiles-dir docker
          dbt build --profiles-dir docker --target qas
