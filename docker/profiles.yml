ec_telecom:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'adb-mock.azuredatabricks.net') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/endpoints/mock') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'dapi_mock') }}"
      schema: dev_bronze_arcotel
      threads: "{{ env_var('DATABRICKS_THREADS', '4') | as_number }}"
    qas:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      schema: qas_bronze_arcotel
      threads: "{{ env_var('DATABRICKS_THREADS', '4') | as_number }}"
    prd:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      schema: prd_bronze_arcotel
      threads: "{{ env_var('DATABRICKS_THREADS', '4') | as_number }}"
